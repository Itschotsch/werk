services:
  mongo:
    image: mongo:8.3
    container_name: werk-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - ./data/db:/data/db
    healthcheck:
      test: ['CMD-SHELL', "mongosh --quiet --eval 'db.runCommand({ping: 1})' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - werk_network

  compass-web:
    image: haohanyang/compass-web:latest
    container_name: werk-compass-web
    restart: unless-stopped
    ports:
      - '8081:8080'
    environment:
      - CW_MONGO_URI=mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - werk_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: werk-backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - MONGODB_URI=mongodb://mongo:27017/werk
    volumes:
      - ./backend:/app
      - /app/node_modules
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/api/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - werk_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: werk-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - BACKEND_URL=http://backend:3001
      - PUBLIC_API_URL=http://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - werk_network

networks:
  werk_network:
    driver: bridge

volumes:
  mongo_data:
